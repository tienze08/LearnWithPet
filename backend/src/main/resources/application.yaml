spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        database-platform: org.hibernate.dialect.MySQLDialect
        hibernate:
            # Production schema changes are applied through Flyway migrations.
            # Validation makes a deployment fail safely when code and schema
            # do not match, instead of letting Hibernate issue ALTER commands.
            ddl-auto: validate
        show-sql: true

    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 1
        baseline-description: Existing VocaPet schema

app:
    jwt:
        secret: ${JWT_SECRET:change-this-local-development-secret-to-at-least-32-characters}
    gemini:
        api-key: ${GEMINI_API_KEY:}
    storage:
        supabase:
            url: ${SUPABASE_URL:}
            service-key: ${SUPABASE_SERVICE_KEY:}
            bucket: ${SUPABASE_STORAGE_BUCKET:vocapet-pdfs}
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
        # The extension still authenticates every request with its own JWT.
        # Set a single chrome-extension://<extension-id> value in production
        # once the Chrome Web Store ID is known.
        allowed-extension-origins: ${APP_CORS_ALLOWED_EXTENSION_ORIGINS:chrome-extension://*}

server:
    port: ${PORT:8080}
    max-http-request-header-size: 16KB

spring.servlet.multipart:
    max-file-size: 25MB
    max-request-size: 26MB
