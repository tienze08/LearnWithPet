spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        database-platform: org.hibernate.dialect.MySQLDialect
        hibernate:
            # Production schema changes are applied through Flyway migrations.
            # Validation makes a deployment fail safely when code and schema
            # do not match, instead of letting Hibernate issue ALTER commands.
            ddl-auto: validate
        show-sql: true

    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 1
        baseline-description: Existing VocaPet schema

app:
    jwt:
        secret: ${JWT_SECRET:change-this-local-development-secret-to-at-least-32-characters}
    gemini:
        api-key: ${GEMINI_API_KEY:}
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

server:
    port: ${PORT:8080}
