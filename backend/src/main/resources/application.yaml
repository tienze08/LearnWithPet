spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        database-platform: org.hibernate.dialect.MySQLDialect
        hibernate:
            # Production schema changes are applied through Flyway migrations.
            # Validation makes a deployment fail safely when code and schema
            # do not match, instead of letting Hibernate issue ALTER commands.
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                # Loads lazy relations (a word's meanings, a link's vocabulary) in batches instead of one query each.
                default_batch_fetch_size: 100

    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 1
        baseline-description: Existing VocaPet schema

app:
    jwt:
        secret: ${JWT_SECRET:change-this-local-development-secret-to-at-least-32-characters}
    gemini:
        api-key: ${GEMINI_API_KEY:}
    storage:
        supabase:
            url: ${SUPABASE_URL:}
            service-key: ${SUPABASE_SERVICE_KEY:}
            bucket: ${SUPABASE_STORAGE_BUCKET:vocapet-pdfs}
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    tango:
        mastery:
            min-answered: 5
            min-accuracy: 0.80
        need-review:
            max-accuracy: 0.60
        lesson:
            quiz-pass-accuracy: 0.80
        answer:
            ignore-vietnamese-diacritics: false
        seed:
            enabled: true
    learning-path:
        enabled: ${LEARNING_PATH_ENABLED:false}
        # Comma-separated emails that get the feature while enabled=false, e.g. for trying it on production.
        allowlist: ${LEARNING_PATH_ALLOWLIST:}

server:
    port: ${PORT:8080}
    max-http-request-header-size: 16KB

spring.servlet.multipart:
    max-file-size: 25MB
    max-request-size: 26MB
