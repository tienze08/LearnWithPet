spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        database-platform: org.hibernate.dialect.MySQLDialect
        hibernate:
            ddl-auto: update
        show-sql: true

app:
    jwt:
        secret: ${JWT_SECRET:change-this-local-development-secret-to-at-least-32-characters}
    gemini:
        api-key: ${GEMINI_API_KEY:}
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    tango:
        mastery:
            min-answered: 5
            min-accuracy: 0.80
        need-review:
            max-accuracy: 0.60
        lesson:
            quiz-pass-accuracy: 0.80
        answer:
            ignore-vietnamese-diacritics: false
        seed:
            enabled: true
    learning-path:
        enabled: ${LEARNING_PATH_ENABLED:false}
        # Comma-separated emails that get the feature while enabled=false, e.g. for trying it on production.
        allowlist: ${LEARNING_PATH_ALLOWLIST:}

server:
    port: ${PORT:8080}
