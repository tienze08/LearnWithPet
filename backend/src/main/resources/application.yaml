spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

app:
    jwt:
        secret: ${JWT_SECRET:change-this-local-development-secret-to-at-least-32-characters}
    gemini:
        api-key: ${GEMINI_API_KEY:}
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

server:
    port: ${PORT:8080}
