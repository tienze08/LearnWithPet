spring:
  datasource:
    url: jdbc:h2:mem:vocabpet-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: test-only-jwt-secret-with-at-least-thirty-two-characters
  gemini:
    api-key: ""
  cors:
    allowed-origins: http://localhost:*
